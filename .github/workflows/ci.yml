name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install flake8 pytest
      # Stage 1: Linting
      - name: Stage 1 - Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Stage 2: Unit Tests (3 tests)
      - name: Stage 2 - Unit Tests
        run: |
          python -m pytest tests/test_service.py -v

      # Stage 3: Secret Scanning (Gitleaks)
      - name: Stage 3 - Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stage 4: Model Evaluation & Quality Gate
      - name: Stage 4 - Evaluate Model & Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/v1
          gh release download v1 -D models/v1 || echo "Release download skipped (running local check)"
          
          if [ -f "results/predictions.jsonl" ]; then
            python tools/score.py results/predictions.jsonl data/validation.jsonl --min-validity 95 --out results/report.json
          else
            echo "Predictions not yet committed, skipping score check in initial CI"
          fi